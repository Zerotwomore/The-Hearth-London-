name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Both values are public by design (they ship to every browser);
          # access is controlled by the database's row level security.
          # Never put the secret / service_role key here.
          NEXT_PUBLIC_SUPABASE_URL: https://kxyjotrixrqvdhdikput.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4eWpvdHJpeHJxdmRoZGlrcHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDc2OTEsImV4cCI6MjEwNzg4MzY5MX0.POJgMyE2ynYp_S8Gy0hQMnkIH70CEMSBJskB06J4ybQ
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
